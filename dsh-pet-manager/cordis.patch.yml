# ============================================================================
# dsh-pet-manager 的 bundle patch —— 把「桌宠管理器」挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   管理器的挂载声明。它不是桌宠引擎：不播动画、不建窗口，只提供一块设置页，
#   用来给 dsh-pet（运行时）增删宠物包、开关单只宠物。
#
# 【与 dsh-pet 的关系】
#   两个独立插件，各自一行 entry：
#     - dsh-pet         运行时（宠物渲染、拖拽、气泡、桌面窗口）
#     - dsh-pet-manager 管理器（本包，只读写 $DSH_HOME/dsh-pet/pet/ 并请运行时重载）
#   管理器不 import 运行时的任何模块，只通过它公开的 /dsh-pet-7340 路由通信。
#
# 【工作原理】
#   - id 必须全局唯一且与包名一致：DSH STORE 上架契约按它比对 entryIds
#   - 插件行那一行（"id: 值"）绝不能写行尾注释：商城预检用正则抓该行的值
#     并要求其后直接换行，行尾注释会让它抓不到 entry ID
#   - name: 'dsh-pet-manager' 解析包入口 lib/index.js（宿主半侧）
#   - 因为 package.json 声明了 dsh.client，DSH 同时把它扫描为浏览器插件，
#     提供 /plugins/dsh-pet-manager/client.js 给页面
#
# ============================================================================

- insert:
    - id: dsh-pet-manager
      name: 'dsh-pet-manager'
